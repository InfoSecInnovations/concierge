name: shabti

include:
  - ../shabti_configurator/docker_compose/docker_compose_dependencies/${KEYCLOAK_SERVICE_FILE:-docker-compose-blank.yml}

services:
  llama-cpp:
    extends:
      file: ../shabti_configurator/docker_compose/docker_compose_dependencies/docker-compose-llama-cpp.yml
      service: llama-cpp-${SHABTI_COMPUTE:-cpu}
  opensearch-node1:
    extends:
      file: ../shabti_configurator/docker_compose/docker_compose_dependencies/docker-compose-opensearch.yml
      service: opensearch-node-base
  tika:
    extends:
      file: ../shabti_configurator/docker_compose/docker_compose_dependencies/docker-compose-tika.yml
      service: tika
  shabti:
    tty: true
    extends:
      file: ../shabti_configurator/docker_compose/docker_compose_dependencies/docker-compose-shabti.yml
      service: ${SHABTI_SERVICE:-shabti}
    build:
      context: ../docker_containers/shabti_api
      additional_contexts:
        python_packages: ../python_packages
      dockerfile: Dockerfile
      target: local
    command: ["sh", "-c", "uv run pytest --junit-xml=/test_results/shabti_api_${JUNIT_FILENAME}.xml -o junit_suite_name='pytest shabti_api_${JUNIT_FILENAME}' && if [ $${SHABTI_SECURITY_ENABLED} = 'False' ]; then cd /app/python_packages/isi_util/ && uv run pytest --junit-xml=/test_results/isi_util_${JUNIT_FILENAME}.xml -o junit_suite_name='pytest isi_util_${JUNIT_FILENAME}'; fi"]
    restart: no
    volumes:
      - ./test_results:/test_results/
      # tests are excluded from the image so they don't ship to production
      - ../docker_containers/shabti_api/tests:/app/shabti/tests

volumes:
  opensearch-data1:
  llama-cpp-models:
  llama-cpp-cache:
  shabti-files:

networks:
  default:
    name: shabti