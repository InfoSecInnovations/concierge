services:
  llama-cpp-cpu:
    container_name: llama_cpp
    image: ghcr.io/ggml-org/llama.cpp:server-cuda
    restart: unless-stopped
    ports:
      - "11434:11434"
    environment:
      - "LLAMA_CACHE=/models/"  
      - "HF_HUB_CACHE=/hf_cache/"
    volumes:
      - llama-cpp-models:/models
      - llama-cpp-cache:/hf_cache
    command: ["--models-preset", "/my-models.ini", "--embeddings", "--port", "11434"]
  llama-cpp-cuda:
    extends: llama-cpp-cpu
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]