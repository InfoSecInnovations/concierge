name: Publish Shabti

on:
  workflow_dispatch:
    inputs:
      release_type:
        description: "Release type"
        type: choice
        options: [alpha, rc, latest]
        default: alpha
        required: true
      release_importance:
        description: "Release importance (while pre 1.0, major bumps 0.x and minor/patch bump 0.x.y)"
        type: choice
        options: [major, minor, patch]
        default: minor
        required: true
      dry_run:
        description: "Work out the versions without publishing or releasing anything"
        type: boolean
        default: false

env:
  UV_PUBLISH_CHECK_URL: "https://pypi.org/simple"

permissions:
  id-token: write  # Required for OIDC
  contents: write

jobs:
  publish:
    runs-on: [self-hosted, linux]
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0  # the version bump diffs components against the previous release tag

      - name: Debug PATH
        run: |
          echo "PATH: $PATH"
          which uv || echo "uv not in PATH"
          ls -la /home/gh-runner/.local/bin/uv || echo "binary not found"
          /home/gh-runner/.local/bin/uv --version || echo "direct exec failed"

      - name: Install Python 3.14
        run: uv python install 3.14
      - name: Install project
        run: bun install

      - name: Increment versions
        id: bump
        run: >
          bun run ./versioning/bump.ts
          --release-type ${{inputs.release_type}}
          --importance ${{inputs.release_importance}}
          ${{inputs.dry_run && '--dry-run' || ''}}
        env:
          GITHUB_TOKEN: ${{github.token}}
      - name: Commit versions
        id: commit
        if: steps.bump.outputs.bumped == 'true' && !inputs.dry_run
        # committed here but only pushed once everything has been published, so a failed run leaves
        # the branch untouched. Only the files the bump touched are staged: the runner is self hosted
        # and reuses its workspace, so `git add -A` would sweep up whatever a previous job left behind
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          printf '%s\n' "${{steps.bump.outputs.touched-files}}" | git add --pathspec-from-file=-
          git commit -m "${{steps.bump.outputs.commit-message}}"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Publish shabti_util
        if: ${{ !inputs.dry_run }}
        working-directory: ./python_packages/shabti_util
        run: |
          uv build
          uv publish
      - name: Publish isi_util
        if: ${{ !inputs.dry_run }}
        working-directory: ./python_packages/isi_util
        run: |
          uv build
          uv publish
      - name: Publish shabti_api_client
        if: ${{ !inputs.dry_run }}
        working-directory: ./python_packages/shabti_api_client
        run: |
          uv build
          uv publish
      - name: Publish shabti_keycloak
        if: ${{ !inputs.dry_run }}
        working-directory: ./python_packages/shabti_keycloak
        run: |
          uv build
          uv publish
      - name: Publish shabti_types
        if: ${{ !inputs.dry_run }}
        working-directory: ./python_packages/shabti_types
        run: |
          uv build
          uv publish

      - name: Build API Client
        working-directory: ./shabti_api_client_node
        run: bun run build
      - name: Build CLI Executable
        working-directory: ./shabti_cli
        run: |
          bun run build_win
          bun run build_linux
          bun run build_mac

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Build and push CPU Docker image
        uses: docker/build-push-action@v7
        with:
          push: ${{ !inputs.dry_run }}
          context: ./docker_containers/shabti_api
          tags: infosecinnovations/shabti:${{steps.bump.outputs.api-version}}
      - name: Build and push web client Docker image
        uses: docker/build-push-action@v7
        with:
          push: ${{ !inputs.dry_run }}
          context: ./docker_containers/shabti_web
          tags: infosecinnovations/shabti-web:${{steps.bump.outputs.web-version}}

      # the signed launcher is carried forward from the release this one follows, which can itself be a
      # prerelease, so the tag is passed explicitly rather than resolved as "latest"
      - uses: ./.github/actions/get_previous_release_assets
        with:
          tag: ${{steps.bump.outputs.previous-release-tag}}

      - name: Zip executables
        run: |
          mkdir -p dist
          zip -j ./dist/shabti_win.zip ./unzipped/win/shabti.exe ./shabti_cli/dist/windows/shabti_cli.exe
          zip -j ./dist/shabti_linux.zip ./unzipped/linux/shabti ./shabti_cli/dist/linux/shabti_cli
          zip -j ./dist/shabti_mac.zip ./unzipped/mac/shabti ./shabti_cli/dist/mac/shabti_cli

      - name: Push versions
        if: steps.bump.outputs.bumped == 'true' && !inputs.dry_run
        run: git push origin HEAD:${{github.ref_name}}
      - name: Release
        if: ${{ !inputs.dry_run }}
        uses: softprops/action-gh-release@v3
        with:
          files: |
            ./dist/*.zip
            ./shabti-components.json
          tag_name: ${{steps.bump.outputs.release-tag}}
          prerelease: ${{steps.bump.outputs.prerelease}}
          # the version bump has to be inside the tag, otherwise the next run sees it as a change
          target_commitish: ${{steps.commit.outputs.sha || github.sha}}
          overwrite_files: false
