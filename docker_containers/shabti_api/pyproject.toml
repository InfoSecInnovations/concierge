[project]
name = "shabti-api"
version = "0.1.0"
requires-python = ">=3.14, <3.15"
dependencies = [
    "beautifulsoup4~=4.14.3",
    "configobj~=5.0.9",
    "fastapi[standard]~=0.119.0",
    "langchain~=1.2.10",
    "langchain-community~=0.4.1",
    "lxml~=6.0.1",
    "opensearch-py~=3.0.0",
    "python-json-logger~=3.3.0",
    "aiofiles~=25.1.0",
    "requests~=2.33.1",
    "semantic-text-splitter~=0.30.1",
    "tokenizers~=0.22.2",
    "tika~=3.1.0",
    "httpx-sse~=0.4.3",
]

[dependency-groups]
dev = [
    "pytest~=8.4.2",
    "pytest-asyncio~=1.2.0",
]

[tool.pytest.ini_options]
asyncio_mode="auto"
asyncio_default_fixture_loop_scope="function"
addopts = "--import-mode=importlib"
