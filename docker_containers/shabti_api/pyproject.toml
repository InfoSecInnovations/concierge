[project]
name = "shabti-api"
version = "0.1.0"
requires-python = ">=3.14, <3.15"
dependencies = [
    "beautifulsoup4==4.14.3",
    "configobj==5.0.9",
    "fastapi[standard]==0.136.3",
    "langchain==1.2.18",
    "langchain-community==0.4.2",
    "lxml==6.0.4",
    "opensearch-py==3.0.0",
    "python-json-logger==3.3.0",
    "aiofiles==25.1.0",
    "requests==2.33.1",
    "semantic-text-splitter==0.30.1",
    "tokenizers==0.22.2",
    "tika==3.1.0",
    "httpx-sse==0.4.3",
    "isi-util",
    "shabti-util",
    "shabti-types",
    "shabti-keycloak",
]

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
]

# these paths are only valid inside the container, run uv lock in Docker (see docs/developer/LOCKFILES.md)
[tool.uv.sources]
isi-util = { path = "/app/python_packages/isi_util", editable = true }
shabti-util = { path = "/app/python_packages/shabti_util", editable = true }
shabti-types = { path = "/app/python_packages/shabti_types", editable = true }
shabti-keycloak = { path = "/app/python_packages/shabti_keycloak", editable = true }

[tool.pytest.ini_options]
asyncio_mode="auto"
asyncio_default_fixture_loop_scope="function"
addopts = "--import-mode=importlib"
