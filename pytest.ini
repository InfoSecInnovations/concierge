[pytest]
asyncio_mode=auto
asyncio_default_fixture_loop_scope=function
# only the genuinely hermetic package, because shabti_api_client's conftests block on container
# hostnames and would hang a bare host side run. Everything else goes through `bun run test`.
testpaths=
    python_packages/isi_util
addopts =
    "--import-mode=importlib"
